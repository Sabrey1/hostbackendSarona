[project]
name = "hostbackendsarona"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlmodel",
    "sqlalchemy",
    "alembic",
    "pymysql",
    "python-dotenv",
    "python-multipart",
    "passlib[bcrypt]",
    "python-jose[cryptography]"
]

[tool.fastapi]
entrypoint = "main:app"